# Example static hosting for the signer origin (signer.example.com).
# Serves the Vite `dist/` output with the production security headers.
# Replace https://app.example.com with the real parent (app) origin.

server {
  listen 443 ssl http2;
  server_name signer.example.com;

  root /var/www/secure-signer;      # the built dist/ directory
  index index.html;

  # --- Security headers (mirrors deploy/_headers) ---
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors https://app.example.com" always;
  add_header Permissions-Policy "publickey-credentials-get=(self), publickey-credentials-create=(self)" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  # Do NOT add X-Frame-Options — the signer is intended to be framed by the app
  # (governed by CSP frame-ancestors above).

  # Content-hashed assets: cache hard.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Everything else (index.html): never cache, so signer updates land immediately.
  location / {
    add_header Cache-Control "no-store" always;
    try_files $uri /index.html;
  }
}
