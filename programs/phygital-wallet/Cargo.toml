[package]
name = "phygital-wallet"
version = "0.1.0"
description = "Passkey-gated smart wallet for phygital tokens"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "phygital_wallet"

[features]
default = ["no-log-ix-name"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
    "phygital-token-client/anchor-idl-build",
]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.0.2"
bytemuck = { version = "1.21", features = ["derive", "min_const_generics"] }
phygital-token-client = { version = "1.0.1", features = ["anchor"] }
solana-instructions-sysvar = "3"
solana-sdk-ids = "3"
solana-sha256-hasher = "3"

[dev-dependencies]
anchor-lang = "1.0.2"
anchor-spl = "1.0.2"
base64 = "0.22.1"
borsh = "1"
litesvm = { version = "0.10.0", features = ["precompiles"] }
p256 = { version = "0.13.2", features = ["ecdsa"] }
phygital-token-client = { version = "1.0.1", features = ["anchor"] }
rand = "0.8"
sha2 = "0.10"
solana-account = "3"
solana-keypair = "3.0.1"
solana-message = "3.0.1"
solana-signer = "3.0.0"
solana-signature = "3"
solana-slot-hashes = "3"
solana-transaction = "3.0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
